name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # 存取 Supabase REST API 根目錄或公共 Endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase Response Status Code: $STATUS"
          
          # 只要回傳 200、204 或 404 (代表有觸發到 API Gateway 且金鑰通過) 都算連線成功
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 204 ] || [ "$STATUS" -eq 404 ]; then
            echo "Ping 成功！已成功觸發 Supabase 服務。"
            exit 0
          else
            echo "Ping 失敗，HTTP 狀態碼為 $STATUS"
            exit 1
          fi
