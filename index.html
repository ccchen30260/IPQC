<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>異常資料管理系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { text-align: center; color: #1a73e8; }
    h2 { margin-top: 0; font-size: 18px; color: #1a73e8; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .form-grid label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
    .form-grid input, .form-grid select, .form-grid textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-grid textarea { grid-column: span 2; resize: vertical; }
    .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-outline { background: white; color: #1a73e8; border: 1px solid #1a73e8; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    .filter-item { display: flex; flex-direction: column; gap: 4px; }
    .filter-item label { font-size: 14px; font-weight: 600; }
    .filter-item input, .filter-item select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .stat-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
    }
    .stat-box .number { font-size: 24px; font-weight: 700; color: #1a73e8; }
    .record-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .record-item {
      border-left: 4px solid #1a73e8;
      background: #fafafa;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: start;
    }
    .record-info { flex: 1; min-width: 200px; }
    .record-info div { margin-bottom: 4px; }
    .record-photo img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
    }
    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      background: #e7f0fe;
      color: #1a73e8;
      font-size: 13px;
    }
    .empty { text-align: center; color: #888; padding: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 異常資料管理系統</h1>

    <!-- 新增異常資料 -->
    <div class="card">
      <h2>➕ 新增異常資料</h2>
      <form id="recordForm" onsubmit="event.preventDefault(); submitRecord();">
        <div class="form-grid">
          <div>
            <label>異常日期</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label>異常班別</label>
            <select id="shift" required>
              <option value="">請選擇</option>
              <option>早班</option>
              <option>中班</option>
              <option>晚班</option>
              <option>夜班</option>
            </select>
          </div>
          <div>
            <label>異常人員</label>
            <input type="text" id="person" placeholder="姓名／工號" required>
          </div>
          <div>
            <label>異常照片</label>
            <input type="file" id="photo" accept="image/*">
          </div>
          <div style="grid-column: span 2;">
            <label>異常描述</label>
            <textarea id="description" rows="2" placeholder="請輸入異常描述" required></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">新增資料</button>
        </div>
      </form>
    </div>

    <!-- 查詢與統計 -->
    <div class="card">
      <h2>🔍 查詢與統計</h2>
      <div class="filter-bar">
        <div class="filter-item">
          <label>年份</label>
          <select id="filterYear"></select>
        </div>
        <div class="filter-item">
          <label>月份</label>
          <select id="filterMonth"></select>
        </div>
        <div class="filter-item">
          <label>日期</label>
          <input type="date" id="filterDate">
        </div>
        <div class="filter-item">
          <label>班別</label>
          <select id="filterShift">
            <option value="">全部班別</option>
            <option>早班</option>
            <option>中班</option>
            <option>晚班</option>
            <option>夜班</option>
          </select>
        </div>
        <div class="filter-item">
          <button class="btn btn-primary" onclick="loadRecords()">查詢</button>
        </div>
      </div>
      <div id="statsContainer"></div>
    </div>

    <!-- 資料列表 -->
    <div class="card">
      <h2>📄 資料列表（<span id="listTitle">當月</span>）</h2>
      <div id="recordsContainer" class="record-list"></div>
    </div>
  </div>

  <script>
    const currentDate = new Date();
    const currentYear = currentDate.getFullYear();
    const currentMonth = String(currentDate.getMonth() + 1).padStart(2, '0');

    function setDefaultDate() {
      const today = new Date();
      document.getElementById('date').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    function populateFilters() {
      const yearSelect = document.getElementById('filterYear');
      const startYear = 2020;
      for (let y = currentYear; y >= startYear; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      const monthSelect = document.getElementById('filterMonth');
      for (let m = 1; m <= 12; m++) {
        const val = String(m).padStart(2, '0');
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val + '月';
        if (val === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }

      document.getElementById('filterDate').value = '';
      document.getElementById('filterShift').value = '';
    }

    function submitRecord() {
      const date = document.getElementById('date').value;
      const shift = document.getElementById('shift').value;
      const person = document.getElementById('person').value.trim();
      const description = document.getElementById('description').value.trim();

      if (!date || !shift || !person || !description) {
        alert('請完整填寫異常日期、班別、人員、描述');
        return;
      }

      const fileInput = document.getElementById('photo');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          google.script.run
            .withSuccessHandler(onAddSuccess)
            .withFailureHandler(onFailure)
            .addRecord(
              { date: date, shift: shift, person: person, description: description },
              e.target.result,
              file.name,
              file.type
            );
        };
        reader.readAsDataURL(file);
      } else {
        google.script.run
          .withSuccessHandler(onAddSuccess)
          .withFailureHandler(onFailure)
          .addRecord(
            { date: date, shift: shift, person: person, description: description },
            null, null, null
          );
      }
    }

    function onAddSuccess(res) {
      if (res.success) {
        const addedDate = document.getElementById('date').value;
        alert('✅ 新增成功');
        document.getElementById('recordForm').reset();
        setDefaultDate();

        // 將查詢條件設定到剛新增的日期，方便立刻看到該筆資料
        if (addedDate) {
          const [y, m] = addedDate.split('-');
          document.getElementById('filterYear').value = y;
          document.getElementById('filterMonth').value = m;
          document.getElementById('filterDate').value = addedDate;
          document.getElementById('filterShift').value = '';
        }

        loadRecords();
      } else {
        alert('❌ 新增失敗：' + res.error);
      }
    }

    function onFailure(err) {
      alert('❌ 系統錯誤：' + err.message);
    }

    function loadRecords() {
      const year = document.getElementById('filterYear').value;
      const month = document.getElementById('filterMonth').value;
      const date = document.getElementById('filterDate').value;
      const shift = document.getElementById('filterShift').value;

      const title = date ? date : (year + '-' + month);
      document.getElementById('listTitle').textContent = title + (shift ? ' / ' + shift : '');

      google.script.run
        .withSuccessHandler(renderRecords)
        .withFailureHandler(onFailure)
        .getStatistics(year, month, shift, date);
    }

    function renderRecords(stats) {
      renderStats(stats);

      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      if (!stats.records || stats.records.length === 0) {
        container.innerHTML = '<div class="empty">尚無資料</div>';
        return;
      }

      stats.records.forEach(rec => {
        const div = document.createElement('div');
        div.className = 'record-item';

        let photoHtml = '';
        if (rec.photoUrl) {
          photoHtml = `
            <div class="record-photo">
              <a href="${rec.photoUrl}" target="_blank">
                <img src="${rec.photoUrl}" alt="異常照片">
              </a>
            </div>
          `;
        }

        div.innerHTML = `
          <div class="record-info">
            <div>
              <span class="tag">${rec.date}</span>
              <span class="tag">${rec.shift}</span>
            </div>
            <div><strong>人員：</strong>${rec.person}</div>
            <div><strong>描述：</strong>${rec.description}</div>
            <div style="margin-top:6px;">
              <button class="btn btn-danger" onclick="deleteRecord('${rec.id}')">刪除</button>
            </div>
          </div>
          ${photoHtml}
        `;

        container.appendChild(div);
      });
    }

    function renderStats(stats) {
      const container = document.getElementById('statsContainer');

      const byShiftHtml = Object.entries(stats.byShift || {}).map(([k, v]) => `<div>${k}：${v}筆</div>`).join('') || '無';
      const byDateHtml = Object.entries(stats.byDate || {}).sort().map(([k, v]) => `<div>${k}：${v}筆</div>`).join('') || '無';
      const byPersonHtml = Object.entries(stats.byPerson || {}).map(([k, v]) => `<div>${k}：${v}筆</div>`).join('') || '無';

      container.innerHTML = `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="number">${stats.total}</div>
            <div>符合筆數</div>
          </div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:10px;">
          <div class="stat-box"><strong>依班別</strong><hr>${byShiftHtml}</div>
          <div class="stat-box"><strong>依日期</strong><hr>${byDateHtml}</div>
          <div class="stat-box"><strong>依人員</strong><hr>${byPersonHtml}</div>
        </div>
      `;
    }

    function deleteRecord(id) {
      if (!confirm('確定要刪除此筆資料嗎？')) return;

      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            alert('🗑️ 已刪除');
            loadRecords();
          } else {
            alert('刪除失敗：' + res.error);
          }
        })
        .withFailureHandler(onFailure)
        .deleteRecord(id);
    }

    // 初始化
    setDefaultDate();
    populateFilters();
    loadRecords();
  </script>
</body>
</html>
